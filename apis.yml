aid: almanac
name: Almanac Health
description: >-
  Almanac Health is a clinical AI company building a unified, evidence-grounded platform that
  delivers specialist-grade medical knowledge to clinicians at the point of care. Founded by
  physician-researcher Cyril Zakka, MD, whose Stanford work produced one of the first
  retrieval-augmented generation (RAG) systems for clinical medicine, the platform consolidates
  the medical AI ecosystem into a single interface where healthcare workers reach a library of
  medical AI tools through an integrated LLM assistant. It is designed to run inside existing
  electronic health record (EHR) systems, operate under institutional governance and controls,
  and stay grounded in peer-reviewed evidence rather than unverified data or pharmaceutical
  advertising. Almanac Health raised a $10M seed round in April 2026 led by F-Prime with
  participation from General Catalyst (which led the pre-seed) and Lightspeed Venture Partners.
  The product is currently undergoing clinical validation in academic medical centers. This
  profile was surfaced from General Catalyst's portfolio and enriched by the API Evangelist
  pipeline; Almanac Health does not currently publish a public developer API, documentation, or
  OpenAPI surface.
